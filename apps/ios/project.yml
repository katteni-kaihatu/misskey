name: GridSpace
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  GridSpaceCore:
    path: Core
targets:
  GridSpace:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GridSpaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gridspace.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ぐりすぺ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSCameraUsageDescription: 投稿する写真や動画を撮影します。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 投稿する動画や音声を録音します。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 投稿する写真や動画を選びます。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 選んだ写真や動画を写真ライブラリへ保存します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  GridSpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GridSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gridspace.ios.uitests
schemes:
  GridSpace:
    build:
      targets:
        GridSpace: all
        GridSpaceUITests: [test]
    test:
      targets:
        - GridSpaceUITests
